name: Mirror to Personal Repo

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  git-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror Push to Personal Repository
        run: |
          # 1. Store the target destination URL cleanly
          TARGET_URL="https://github.com/fort-solar/fortsolar-installer-webapp-frontend-clone.git"
          
          # 2. Inject authentication safely via extraheader instead of the URL string
          git config --global http.https://github.com/.extraheader "Authorization: Basic $(echo -n "x-access-token:${{ secrets.PERSONAL_REPO_TOKEN }}" | base64)"
          
          # 3. Execute the mirror push
          git push --prune --force "$TARGET_URL" "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
